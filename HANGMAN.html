<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Le Jeu Du Pendu</title>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="fun.css">
        <script src="codejs.js" defer></script>
    </head>
    <body onload="playAudio()">
        <header>
            <h1>HANGMAN</h1>
            <p>Powered by CHENNOUFI Hédi G1</p>
        </header>
        <div id="messageContainer" >Vous êtes déconnecté</div>
        <audio id="myAudio" autoplay loop>
            <source src="musique.mp3" type="audio/mp3">
        </audio>
        <audio id="touche">
            <source src="touche.wav" type="audio/wav">
        </audio>
        <audio id="win">
            <source src="win.mp3" type="audio/mp3">
        </audio>
        <audio id="perdu">
            <source src="perdu.wav" type="audio/wav">
        </audio>
        <script>
            var audio;
            
            window.onload = function() {
              audio = document.getElementById("myAudio");
            };

            function playAudio() {
                if (audio) {
                    audio.play();
                }
            }
            
            function toggleAudio() {
              if (audio && !audio.paused) {
                audio.pause();
                audioButton.innerText = "Music";
              } else if (audio) {
                audio.play();
                audioButton.innerText = "No music";
              }
            }
        </script>
        <button id="audioButton" onclick="toggleAudio()">Music</button>
        <div id="gameContainer">
            <div id="authBlock">
                <section id="connexion">
                    <h2>Connexion</h2>
                    <div>
                        <label for="connexionUsername">Nom d'utilisateur</label>
                        <input type="text" id="connexionUsername">
                    </div>
                    <div> 
                        <label for="connexionPassword">Mot de passe</label>
                        <input type="password" id="connexionPassword">
                    </div>
                    <button id="connexionButton" style="font-family: 'Comic Sans MS', cursive">Se connecter</button>
                </section>

                <p id="ins">Vous n'avez pas de compte ? Inscrivez-vous.</p>

                <section id="inscription">
                    <h2>Inscription</h2>
                    <div>
                        <label for="inscriptionUsername">Nom d'utilisateur</label>
                        <input type="text" id="inscriptionUsername">
                    </div>
                    <div>
                        <label for="inscriptionPassword">Mot de passe</label>
                        <input type="password" id="inscriptionPassword">
                    </div>
                    <button id="inscriptionButton" style="font-family: 'Comic Sans MS', cursive">S'inscrire</button>
                </section>
            </div>
            <div>
                <p id="newgame"><input type="button" style="font-family: 'Comic Sans MS', cursive" value="NOUVELLE PARTIE"></p>
                <p id="continue"><input type="button" style="font-family: 'Comic Sans MS', cursive" value="CONTINUER"></p>
                <p id="menu"><input type="button" style="font-family: 'Comic Sans MS', cursive" value="MENU"></p>
                <p id="deco"><input type="button"  style="font-family: 'Comic Sans MS', cursive" value="DECONNEXION"></p>
                <div id="chargement" style="display: none">
                    <img src="load.gif" alt="Chargement en cours...">
                </div>
                <div id="loose" style="display: none">
                    <img src="loose.gif" alt="..">
                </div>
            </div> 
            <div id="gimage">
                <svg width="258" height="400">
                    <rect y="380" x="2" width="250" height="10" style="fill:yellow;stroke-width:4;stroke:black" />

                    <line x1="20" y1="380" x2="20" y2="10" style="stroke:black;stroke-width:4"/>

                    <line x1="18" y1="10" x2="140" y2="10" style="stroke:black;stroke-width:4"/>

                    <line id="i1" x1="138" y1="10" x2="138" y2="50" style="stroke:black;stroke-width:4"/>
                    
                    <circle id="i2" cx="138" cy="80" r="30" stroke="black" stroke-width="4" fill="yellow" />

                    <line id="i3" x1="138" y1="110" x2="138" y2="250" style="stroke:black;stroke-width:4"/>

                    <line id="i4" x1="138" y1="140" x2="100" y2="200" style="stroke:black;stroke-width:4"/>

                    <line id="i5" x1="138" y1="140" x2="178" y2="200" style="stroke:black;stroke-width:4"/>

                    <line id="i6" x1="138" y1="250" x2="100" y2="310" style="stroke:black;stroke-width:4"/>

                    <line id="i7" x1="138" y1="250" x2="178" y2="310" style="stroke:black;stroke-width:4"/>
                </svg>
            </div>
            <div id="gcontrols">
                <p>Choisissez une lettre et devinez le mot !</p>
                <p id="word2guess"></p>
                <p id="gchars">
                    <span>A</span>
                    <span>B</span>
                    <span>C</span>
                    <span>D</span>
                    <span>E</span>
                    <span>F</span>
                    <span>G</span>
                    <span>H</span>
                    <span>I</span>
                    <span>J</span>
                    <span>K</span>
                    <span>L</span>
                    <span>M</span>
                    <span>N</span>
                    <span>O</span>
                    <span>P</span>
                    <span>Q</span>
                    <span>R</span>
                    <span>S</span>
                    <span>T</span>
                    <span>U</span>
                    <span>V</span>
                    <span>W</span>
                    <span>X</span>
                    <span>Y</span>
                    <span>Z</span>
                </p>
                <p id="restartb"><input type="button" style="font-family: 'Comic Sans MS', cursive" display="none" value="RESTART"></p>
            </div>
        </div>
    </body>
</html>
